# Run: docker compose up --build
# Settings are read from a .env file (see .env.example)

name: actsistant

services:

  api:
    build: .
    ports:
      - "127.0.0.1:5005:5005"
    environment:
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      LOCAL_CHAT_MODEL: ${LOCAL_CHAT_MODEL:-qwen3:8b}
      CLOUD_CHAT_MODEL: ${CLOUD_CHAT_MODEL:-gpt-6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_RUN_ONLY: ${LOCAL_RUN_ONLY:-False}
      ANSWER_TIMEOUT: ${ANSWER_TIMEOUT:-120}
    depends_on:
      weaviate:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully

  weaviate:
    image: semitechnologies/weaviate:1.39.7
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.18
    ports:
      # A natively installed Ollama listens on the same port, stop it first
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  ollama-models:
    image: ollama/ollama:0.40.18
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      LOCAL_CHAT_MODEL: ${LOCAL_CHAT_MODEL:-qwen3:8b}
      OPENAI_API_KEY_SET: ${OPENAI_API_KEY:+true}
      LOCAL_RUN_ONLY: ${LOCAL_RUN_ONLY:-False}
    entrypoint: ["/bin/sh", "-ec"]
    
    command:
      - |
        pull() {
          if ollama show "$$1" > /dev/null 2>&1; then
            echo "$$1 is already pulled"
          else
            ollama pull "$$1"
          fi
        }
        pull "$$EMBEDDING_MODEL"
        if [ -z "$$OPENAI_API_KEY_SET" ] || [ "$$(echo "$$LOCAL_RUN_ONLY" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
          pull "$$LOCAL_CHAT_MODEL"
        fi

volumes:
  weaviate_data:
  ollama_models:
